<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4B6E"/>
      <stop offset="22%" stop-color="#FF9F43"/>
      <stop offset="45%" stop-color="#FECA57"/>
      <stop offset="68%" stop-color="#1DD1A1"/>
      <stop offset="85%" stop-color="#54A0FF"/>
      <stop offset="100%" stop-color="#9B51E0"/>
    </linearGradient>
    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B6E"/>
      <stop offset="50%" stop-color="#FF9F43"/>
      <stop offset="100%" stop-color="#FECA57"/>
    </linearGradient>
    <linearGradient id="wingRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9B51E0"/>
      <stop offset="50%" stop-color="#54A0FF"/>
      <stop offset="100%" stop-color="#1DD1A1"/>
    </linearGradient>
  </defs>

  <!-- Outer Rainbow Arc (Mentor Horizon) -->
  <path d="M 18 68 A 46 46 0 0 1 110 68" fill="none" stroke="url(#rainbowGrad)" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
  <path d="M 28 68 A 36 36 0 0 1 100 68" fill="none" stroke="url(#rainbowGrad)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- Left Butterfly Wings (Coach Action) -->
  <path d="M 61 66 C 44 40, 18 46, 22 70 C 24 82, 46 86, 61 78 Z" fill="url(#wingLeft)" opacity="0.95"/>
  <path d="M 61 80 C 45 84, 30 96, 38 108 C 45 116, 57 104, 62 88 Z" fill="url(#wingLeft)" opacity="0.85"/>

  <!-- Right Butterfly Wings (Coach Momentum) -->
  <path d="M 67 66 C 84 40, 110 46, 106 70 C 104 82, 82 86, 67 78 Z" fill="url(#wingRight)" opacity="0.95"/>
  <path d="M 67 80 C 83 84, 98 96, 90 108 C 83 116, 71 104, 66 88 Z" fill="url(#wingRight)" opacity="0.85"/>

  <!-- Butterfly Body & Antennae -->
  <rect x="61.5" y="56" width="5" height="38" rx="2.5" fill="#FFFFFF"/>
  <path d="M 62.5 57 Q 55 46 49 48" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 65.5 57 Q 73 46 79 48" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
</svg>
